plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 in 1.18+, target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 开发环境必须开启 refmap 重映射，否则第三方 mod(Create/Ponder) 的 mixin
            // 会拿 SRG 名去官方名类里找目标，导致 Mixin apply failed
            // (例如 ponder-common.mixins.json:client.WindowResizeMixin 找不到 Minecraft.m_5741_)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.tterrag.com/" } // Registrate (1.20.1)
    maven { url = "https://repo.spongepowered.org/maven" }
    maven { url = "https://api.modrinth.com/maven" } // Modrinth Maven (JEI, TLM, Jade 等测试用 mod)
    flatDir {
        dir 'libs'
    }
}

// 仅测试时挂载（localRuntime）：运行测试时加载，但不作为编译依赖、不打入发布 jar
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create dependencies for 1.20.1 Forge
    // 注意：只引 :slim（开发环境用的就是它）。
    // :all 是给玩家整合包用的"全家桶"jar，内部 META-INF/jarjar 里还打包了
    // Ponder-Forge-1.20.1-1.0.91.jar；在开发环境里会和下面单独引入的 Ponder 冲突
    // （classpath 上出现两份 ponder-common.mixins.json / ponder.refmap.json），
    // 导致 refmap 取到错误的一份，WindowResizeMixin 注入失败：
    //   could not find any targets matching 'Lnet/minecraft/client/Minecraft;m_5741_()V'
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")

    // Registrate：Create 6.x 依赖它（jarjar 在 Create jar 内，开发环境需显式引入）
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    // Ponder & Catnip (jarjar'd inside Create jar but not resolved by maven transitive;
    // Ponder jar also bundles net.createmod.catnip classes)
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")

    // MixinExtras：Create 6.x 的 mixin 依赖它。版本与 Create 6.0.8-291 内部
    // META-INF/jarjar/mixinextras-forge-0.4.1.jar 保持一致。
    // 开发环境不会自动带上 jarjar 内的库，缺失会在启动时报
    // ClassMetadataNotFoundException: ...mixinextras.injector.wrapoperation.Operation
    implementation "io.github.llamalad7:mixinextras-forge:0.4.1"

    // Mixin annotation processor for refmap generation
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ProjectE(等价交换) 为软依赖：仅编译期引用，不打包、不强制运行时加载
    // jar 以 flatDir 形式放在 libs/ 下并做 fg.deobf，使开发环境也能加载（配合下面的 localRuntime 测试）
    compileOnly fg.deobf("create_labor.local:ProjectE-1.20.1-PE1:1.0.1")
    // 仅在开发环境挂载，便于测试 EMC 联动内容
    localRuntime fg.deobf("create_labor.local:ProjectE-1.20.1-PE1:1.0.1")

    // 仅测试时挂载（localRuntime）：JEI / TLM(东方小女仆) / Jade
    localRuntime fg.deobf("maven.modrinth:jei:${jei_version}")
    localRuntime fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")
    localRuntime fg.deobf("maven.modrinth:jade:${jade_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'create_labor.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
